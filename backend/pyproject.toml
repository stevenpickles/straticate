[project]
name = "straticate"
version = "0.1.0.dev0"
description = "Straticate backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-ulid>=4.0.1",
    "python-multipart>=0.0.32",
    # The model download manager (feature 025) streams weights over HTTPS.
    # Already the test suite's HTTP client (see DEVELOPMENT.md); promoted to a
    # runtime dependency rather than adding a second client library.
    "httpx2>=2.12",
]

# Real inference (feature 026), made **optional** again by feature 034. The
# application imports, starts, serves and runs the fake separator (and its whole
# end-to-end workflow) without any of this: nothing outside
# ``src/straticate/inference/roformer/`` imports torch, and the registry imports
# that package only when a job actually asks for a model of its architecture.
# A build without the extra answers such a job with ``separator_unavailable``
# (501) — the same envelope a catalogued-but-unimplemented architecture has
# always produced.
#
# So this is what a *user* who wants real separation installs, and what the
# ``backend`` CI job installs to run the real separator's unit tests; the ``e2e``
# job, which drives the fake engine exclusively, does not — that is ~183 MiB it
# never executed (``docs/features/030-playwright-e2e.md``, finding 2).
#
#     uv sync --extra torch
#
# Feature 018's design is the one being restored here: torch is an optional
# runtime probe, and its *absence* is a normal, first-class, tested path.
[project.optional-dependencies]
torch = [
    # ``torch`` is resolved from the CPU wheel index below so ``--extra torch``
    # — and CI — never pulls the bundled multi-gigabyte CUDA runtime;
    # DEVELOPMENT.md documents installing the CUDA build for GPU use. The
    # remaining three are what the vendored Mel-Band RoFormer architecture
    # imports (see ``src/straticate/inference/roformer/vendor/README.md``): all
    # pure-Python, all tiny, none of them a model registry or a downloader.
    #
    # Feature 028 (Hybrid Transformer Demucs) added **no** dependency at all:
    # its vendored architecture imports only ``torch``, ``einops`` and
    # ``numpy``, every one of which is already here. Depending on the ``demucs``
    # package instead would have added eight — including ``huggingface-hub``
    # (a second model registry and downloader), ``lameenc`` and ``sphn`` (a
    # second audio I/O layer) and ``tqdm``. See
    # ``src/straticate/inference/demucs/vendor/README.md``.
    "torch>=2.4",
    # torch warns at *import* time when NumPy is absent ("Failed to initialize
    # NumPy"), which the suite would see as a finding under ``-W error``
    # (DEVELOPMENT.md). Declaring it is the fix rather than the filter: torch
    # treats NumPy as present in several conversion paths, and the wheel is a
    # few tens of megabytes next to torch's own hundreds. It belongs *here*
    # rather than with the base dependencies because the only Straticate code
    # that imports it is ``roformer/vendor/mel_filters.py``, which is reached
    # solely through the vendored architecture.
    "numpy>=1.26",
    "einops>=0.7",
    "rotary-embedding-torch>=0.6",
    "beartype>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

# PyTorch's default PyPI wheels bundle the CUDA runtime on Linux — several
# gigabytes per install, downloaded on every CI run, for a job that has no GPU
# (ARCHITECTURE.md §14: normal CI never requires CUDA). So ``torch`` is pinned
# to PyTorch's CPU wheel index, which is the right default for CI, for
# development on a CPU-only host, and for macOS/Windows where the PyPI wheel is
# CPU-only anyway. ``explicit = true`` keeps every *other* package resolving
# from PyPI. Installing the CUDA build is one documented command — see
# DEVELOPMENT.md, "PyTorch and CUDA". Feature 034 moved ``torch`` into an
# optional extra; this pinning is unchanged and still governs it, because
# ``tool.uv.sources`` applies to a requirement wherever it is declared.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/straticate"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Vendored third-party code is pinned, not maintained: it must stay diffable
# against the upstream commit it was copied from, so it is neither formatted nor
# linted here. See each directory's README.md.
extend-exclude = [
    "src/straticate/inference/roformer/vendor",
    "src/straticate/inference/demucs/vendor",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
# Same reason as Ruff's exclusion above: the vendored architecture is upstream's
# code, in upstream's style, with no annotations. ``exclude`` drops it from the
# analysed set and ``ignore`` silences the diagnostics it still produces as an
# imported module, so strict mode keeps its teeth everywhere Straticate writes
# code. ``mel_filters.py`` is Straticate's own and is deliberately *not*
# excluded — it lives in that directory only because it substitutes for a
# library the vendored file imports.
exclude = [
    "src/straticate/inference/roformer/vendor/attend.py",
    "src/straticate/inference/roformer/vendor/mel_band_roformer.py",
    "src/straticate/inference/demucs/vendor/demucs.py",
    "src/straticate/inference/demucs/vendor/hdemucs.py",
    "src/straticate/inference/demucs/vendor/htdemucs.py",
    "src/straticate/inference/demucs/vendor/spec.py",
    "src/straticate/inference/demucs/vendor/states.py",
    "src/straticate/inference/demucs/vendor/transformer.py",
    "src/straticate/inference/demucs/vendor/utils.py",
    "src/straticate/inference/demucs/vendor/wiener.py",
]
ignore = [
    "src/straticate/inference/roformer/vendor/attend.py",
    "src/straticate/inference/roformer/vendor/mel_band_roformer.py",
    "src/straticate/inference/demucs/vendor/demucs.py",
    "src/straticate/inference/demucs/vendor/hdemucs.py",
    "src/straticate/inference/demucs/vendor/htdemucs.py",
    "src/straticate/inference/demucs/vendor/spec.py",
    "src/straticate/inference/demucs/vendor/states.py",
    "src/straticate/inference/demucs/vendor/transformer.py",
    "src/straticate/inference/demucs/vendor/utils.py",
    "src/straticate/inference/demucs/vendor/wiener.py",
]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The real-model tier is opt-in. ARCHITECTURE.md §14 forbids normal CI from
# needing CUDA or a model download, and DEVELOPMENT.md has always described this
# as a "manually triggered" suite -- so a plain ``pytest`` deselects it, and
# ``pytest -m integration`` (the command line's ``-m`` wins over this one) runs
# it. See tests/test_roformer_integration.py.
addopts = "-m 'not integration'"
markers = [
    "integration: needs installed model weights and/or real hardware; deselected by default",
    "gpu: needs a CUDA device; skipped when none is present",
]
