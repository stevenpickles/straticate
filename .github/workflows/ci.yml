name: CI

# `release/**` is here so that work on a release branch is verified the same way
# work on `dev` is. Without it a PR into `release/vX.Y.Z` reports no checks at
# all, and the release branch's content would first be tested by the release PR
# into `main` — the last moment anyone wants to discover a problem. Tags are
# deliberately absent: the tag push publishes the release (`release.yml`) and
# points at a commit this pipeline has already passed on.
on:
  pull_request:
    branches: [dev, main, 'release/**']
  push:
    branches: [dev, main, 'release/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    # Installs the optional ``torch`` extra (feature 034) and keeps doing so:
    # this is the job that runs the real separator's unit tests, type-checks
    # the module that imports torch, and is therefore the one place the extra
    # is genuinely exercised. ``--extra torch`` is repeated on every ``uv run``
    # so each step states the environment it needs rather than depending on
    # what the sync step happened to leave behind. (Measured on uv 0.8.23:
    # ``uv run`` reconciles versions but does **not** prune packages that are
    # merely not required, so a bare ``uv run`` here would not in fact drop
    # torch — but relying on that is relying on an implementation detail, and
    # these are the same commands AGENTS.md tells a contributor to type.)
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --extra torch

      - name: Format check
        run: uv run --extra torch ruff format --check .

      - name: Lint
        run: uv run --extra torch ruff check .

      - name: Type check
        run: uv run --extra torch pyright

      - name: Tests
        run: uv run --extra torch pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    # The end-to-end tier (feature 030): a real backend, a real Vite dev
    # server and a real Chromium, driving M1's workflow against the **fake
    # separator**. No GPU, no model download, no weights — the fake engine
    # covers the whole workflow (ARCHITECTURE.md §8).
    #
    # It is a job of its own rather than steps bolted onto `frontend`: it
    # needs the *backend* installed as well as the frontend, and hanging that
    # off the lint/unit job would slow the fastest feedback in the pipeline
    # for everyone. As a separate job it runs in parallel with the other two,
    # so the wall-clock cost of a PR is the cost of the slowest job, not the
    # sum. FFmpeg lives here — this is the job that generates the audio
    # fixtures and the one the backend transcodes exports in.
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Deliberately **without** ``--extra torch``. This tier drives the fake
      # separator exclusively, so PyTorch is ~183 MiB it would download and
      # never execute; since feature 034 the application imports, starts and
      # serves without it, and a plain ``uv sync`` is what proves that on every
      # PR. If this step ever needs the extra, the lazy-import property has
      # regressed — fix that rather than this line.
      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Browsers are ~110 MB and change only when @playwright/test does, so
      # they are cached against the lockfile that pins it. Only Chromium is
      # installed: the tier tests correctness, not browser compatibility.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser but not the apt packages it links
      # against, which live in the runner image and are replaced with it.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e

      # Feature 042: the one-process claim, checked against a **real** Vite
      # build. `backend/tests/test_frontend_mount.py` covers the routing
      # hermetically with a synthetic bundle — which is the right place for it,
      # and fast — but a synthetic bundle cannot notice the one thing only a
      # real build decides: that its own asset URLs are root-relative and
      # resolve against the mount. Change `base` in `vite.config.ts` and every
      # hermetic test still passes while the served app loads nothing.
      #
      # It lives here because this job already has both toolchains installed,
      # so the marginal cost is one `vite build` and one server start —
      # measured at 5 s (4 s + 1 s) — rather than the ~1 min a job of its own
      # would spend installing Python and Node to do the same thing.
      # It is deliberately *not* a Playwright spec: `webServer` is
      # global to the config, so a production spec would make every local
      # `npm run e2e` build the frontend and start a third server first.
      #
      # After the tier above, so a real end-to-end failure reports first, and
      # so the tier itself runs against exactly the arrangement it always has.
      - name: Build the frontend bundle
        working-directory: frontend
        run: npm run build

      - name: The built app is served by the backend, and never over the API
        working-directory: backend
        env:
          STRATICATE_PORT: '8124'
        run: |
          STRATICATE_DATA_DIR="$RUNNER_TEMP/production" \
            uv run python -m straticate > "$RUNNER_TEMP/production.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          base="http://127.0.0.1:$STRATICATE_PORT"
          curl -sf --retry 60 --retry-delay 1 --retry-all-errors \
            --retry-connrefused "$base/api/v1/health" > /dev/null

          # The root URL is the built app, and so is a deep link into it.
          curl -sf "$base/" | grep -q '<div id="root">'
          curl -sf "$base/jobs/deep-link" | grep -q '<div id="root">'

          # The asset the built index.html actually asks for resolves — and is
          # the *script*, not the entry document. Checking only that the fetch
          # succeeds would prove nothing about the file existing: a fallback
          # that answered every miss with index.html returns 200 for a chunk
          # that is not there, so the content type is what makes this real.
          asset=$(curl -sf "$base/" | sed -n 's|.*src="\(/assets/[^"]*\)".*|\1|p' | head -1)
          test -n "$asset"
          type=$(curl -sf -o /dev/null -w '%{content_type}' "$base$asset")
          case "$type" in
            *javascript*) ;;
            *) echo "::error::$asset was served as '$type', not JavaScript"; exit 1 ;;
          esac

          # A genuine miss inside the bundle stays a 404: a stale chunk must not
          # come back as HTML for the browser to choke on.
          missing=$(curl -s -o /dev/null -w '%{http_code}' "$base/assets/no-such-chunk.js")
          test "$missing" = 404

          # …and the API is untouched: an unknown path is still the envelope, in
          # every spelling. `--path-as-is` stops curl collapsing the `//` that a
          # client concatenating onto a trailing-slash base emits.
          for path in /api/v1/nope //api/v1/nope; do
            status=$(curl -s --path-as-is -o "$RUNNER_TEMP/nope.json" \
              -w '%{http_code}' "$base$path")
            test "$status" = 404
            grep -q '"not_found"' "$RUNNER_TEMP/nope.json"
          done

          # A trailing slash on a real route still redirects rather than
          # silently becoming the app.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/docs/")" = 307

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
